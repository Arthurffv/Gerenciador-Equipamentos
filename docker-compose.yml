name: gestao-equipamentos

services:
  postgres:
    image: postgres:16-alpine
    container_name: eqp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eqp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eqp_pass}
      POSTGRES_DB: ${POSTGRES_DB:-equipamentos}
      TZ: America/Sao_Paulo
    ports:
      - "5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # As imagens oficiais minio/minio e minio/mc foram removidas do Docker Hub
  # (set/2026). Usamos a imagem mantida pela Chainguard, compatível com o MinIO.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: eqp-minio
    restart: unless-stopped
    user: "0:0" # dev: evita problema de permissão no volume (a imagem roda como 65532)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    # Sem healthcheck: a imagem não tem curl/wget/mc.
    # O bucket é criado pelo backend na inicialização (ou manualmente no console).

volumes:
  postgres_data:
  minio_data:
